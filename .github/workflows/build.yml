name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: StormIsland-linux-x64
          - name: Windows
            os: windows-latest
            artifact: StormIsland-windows-x64
          - name: macOS
            os: macos-latest
            artifact: StormIsland-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (headless match simulation)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Client smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: build/bin
        run: |
          STORM_AUTOTEST=1 timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" ./stormisland > client.log 2>&1 || (tail -50 client.log; exit 1)
          ls -la autotest_*.png

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp -r build/bin/* dist/${{ matrix.artifact }}/
          rm -f dist/${{ matrix.artifact }}/storm_tests* dist/${{ matrix.artifact }}/client.log dist/${{ matrix.artifact }}/autotest_*.png dist/${{ matrix.artifact }}/stormisland_settings.json
          cp README.md dist/${{ matrix.artifact }}/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ${{ matrix.artifact }}.zip ${{ matrix.artifact }}
          else
            zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

      - name: Upload smoke-test screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/bin/autotest_*.png

  docker:
    name: Docker image (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stormisland-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name storm -p 8080:8080 -e STORM_ADMIN_PASSWORD=ci-password stormisland-backend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health 2>/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/admin
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/api/register -d '{"username":"citest","password":"ci-pass-123"}' | jq -r .token)
          TICKET=$(curl -fsS -X POST http://127.0.0.1:8080/api/matchmaking/join -H "Authorization: Bearer $TOKEN" -d '{"playlist":"solo"}' | jq -r .ticket)
          for i in $(seq 1 20); do
            STATUS=$(curl -fsS "http://127.0.0.1:8080/api/matchmaking/status?ticket=$TICKET" -H "Authorization: Bearer $TOKEN")
            echo "$STATUS"
            echo "$STATUS" | jq -e '.status == "assigned"' > /dev/null && break
            sleep 1
          done
          echo "$STATUS" | jq -e '.status == "assigned"'
          sleep 2
          docker logs storm 2>&1 | tee container.log
          grep -q "game server registered" container.log
          docker stop storm

      - name: Image metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
